stages:
  - lint
  - test
  - build

default:
  image: ghcr.io/astral-sh/uv:0.11.8-python3.12-trixie-slim
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen

variables:
  UV_CACHE_DIR: .uv-cache
  UV_PYTHON_DOWNLOADS: never

lint:
  stage: lint
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run mypy app tests

test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: prices
    POSTGRES_PASSWORD: prices
    POSTGRES_DB: prices_test
    TEST_DATABASE_URL: postgresql+asyncpg://prices:prices@postgres:5432/prices_test
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
